name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download offline v86 emulation engine
        run: |
          mkdir -p app/src/main/assets/v86/bios
          curl -fsSL -o app/src/main/assets/v86/libv86.js https://cdn.jsdelivr.net/npm/v86@latest/build/libv86.js
          curl -fsSL -o app/src/main/assets/v86/v86.wasm https://cdn.jsdelivr.net/npm/v86@latest/build/v86.wasm
          curl -fsSL -o app/src/main/assets/v86/bios/seabios.bin https://cdn.jsdelivr.net/npm/v86@latest/bios/seabios.bin
          curl -fsSL -o app/src/main/assets/v86/bios/vgabios.bin https://cdn.jsdelivr.net/npm/v86@latest/bios/vgabios.bin
          ls -la app/src/main/assets/v86 app/src/main/assets/v86/bios

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-emulator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Builds the REAL QEMU-based Limbo engine (genuine x86_64 guest CPU
  # emulation) from its own upstream source, following limboemu/limbo's
  # own documented build process (README.developers). This produces a
  # separate, independent APK — Hybrid Emulator launches it by package
  # name (see LimboStyleActivity.launchLimboEngine) rather than embedding
  # its native code in-process, since Limbo's native build has its own
  # dedicated multi-library NDK toolchain that is not a drop-in Gradle
  # dependency. This job is long-running and, being a non-trivial native
  # cross-compile of QEMU + its dependencies, may need log-driven fixes
  # on versions newer than what this workflow was written against.
  build-limbo-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Limbo (upstream QEMU engine) source
        uses: actions/checkout@v4
        with:
          repository: limboemu/limbo
          path: limbo-engine

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make autoconf automake git python3 python-is-python3 binutils \
            libtool-bin pkg-config flex bison gettext texinfo rsync wget

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate sdkmanager on the runner's pre-installed Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Using SDK root: $SDK_ROOT"
          CMDLINE_TOOLS_BIN=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name "sdkmanager" -exec dirname {} \; | sort -r | head -n 1)
          if [ -z "$CMDLINE_TOOLS_BIN" ]; then
            echo "::error::Could not find sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Found sdkmanager at: $CMDLINE_TOOLS_BIN"
          echo "$CMDLINE_TOOLS_BIN" >> "$GITHUB_PATH"
          echo "LIMBO_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Install Android NDK r23b
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;23.2.8568313"
          echo "LIMBO_NDK_ROOT=$LIMBO_SDK_ROOT/ndk/23.2.8568313" >> "$GITHUB_ENV"

      - name: Download external libraries (QEMU, glib, libffi, pixman, SDL2)
        working-directory: limbo-engine/limbo-android-lib/src/main/jni
        run: |
          wget -q http://download.qemu-project.org/qemu-5.1.0.tar.xz -P /tmp/
          tar -xJf /tmp/qemu-5.1.0.tar.xz && mv qemu-5.1.0 qemu

          wget -q https://ftp.gnome.org/pub/GNOME/sources/glib/2.56/glib-2.56.1.tar.xz -P /tmp/
          tar -xJf /tmp/glib-2.56.1.tar.xz && mv glib-2.56.1 glib

          wget -q https://sourceware.org/pub/libffi/libffi-3.3.tar.gz -P /tmp/
          tar -xzf /tmp/libffi-3.3.tar.gz && mv libffi-3.3 libffi

          wget -q https://www.cairographics.org/releases/pixman-0.40.0.tar.gz -P /tmp/
          tar -xzf /tmp/pixman-0.40.0.tar.gz && mv pixman-0.40.0 pixman

          wget -q https://www.libsdl.org/release/SDL2-2.0.8.tar.gz -P /tmp/
          tar -xzf /tmp/SDL2-2.0.8.tar.gz && mv SDL2-2.0.8 SDL2

      - name: Apply Limbo's upstream patches
        working-directory: limbo-engine/limbo-android-lib/src/main/jni
        run: |
          (cd qemu && patch -p1 < ../patches/qemu-5.1.0.patch)
          (cd glib && patch -p1 < ../patches/glib-2.56.1.patch)
          (cd SDL2 && patch -p1 < ../patches/sdl2-2.0.8.patch)

      # Host = arm64-v8a (matches the Redmi 13 / modern ARM64 phones target).
      # Guest = x86_64-softmmu (genuine 64-bit x86_64 CPU emulation).
      - name: Build native QEMU libraries (arm64-v8a host, x86_64 guest)
        working-directory: limbo-engine/limbo-android-lib/src/main/jni
        env:
          NDK_ROOT: ${{ env.LIMBO_NDK_ROOT }}
          BUILD_HOST: arm64-v8a
          BUILD_GUEST: x86_64-softmmu
        run: make limbo

      - name: Build Limbo APK
        working-directory: limbo-engine
        run: |
          chmod +x gradlew
          ./gradlew :limbo-android-x86:assembleRelease --stacktrace

      - name: Upload Limbo engine APK
        uses: actions/upload-artifact@v4
        with:
          name: limbo-x86_64-engine-apk
          path: limbo-engine/limbo-android-x86/build/outputs/apk/release/*.apk
          if-no-files-found: warn
